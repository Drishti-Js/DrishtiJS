name: Verify and publish framework installers
on:
  push:
    branches: [main]
    paths:
      - 'releases/**'
      - 'scripts/verify-native-release.py'
      - 'scripts/publish-native-release.py'
      - '.github/workflows/publish-framework-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: framework-release
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify artifacts and run the actual framework binaries
        run: python scripts/verify-native-release.py --platform ${{ matrix.platform }}
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify-native-release.py
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish-native-release.py
